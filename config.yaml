# Общие фильтры — действуют на все поиски. Любой поиск может переопределить
# отдельные поля своим блоком filters.
filters:
  price_min: 700 # EUR/месяц
  price_max: 1100
  m2_min: 60
  # Верхней границы площади в критериях нет. 200 стоит не как требование,
  # а как защита от опечаток: на сайтах попадаются «трёхкомнатные 1003 m²»
  # за 800 €. Убери строку, если хочешь видеть и такие.
  m2_max: 200
  furnished: null # yes | no | null (неважно)
  only_private: false # true — скрыть объявления агентств
  exclude_keywords: # отсев по тексту, регистр не важен
    - cimer # сосед по комнате
    - soba u stanu # комната, а не квартира

# Что мониторим. Список виденного общий для всех поисков.
#
# География: Нови-Сад с окрестностями, включая заречные Петроварадин,
# Сремску-Каменицу, Мишелук и Алибеговац.
#
# 4zida и nekretnine включают заречье в свой поиск по Нови-Саду — проверено
# по выдаче. А oglasi.rs держит Петроварадин и Сремску-Каменицу отдельными
# разделами: в их хлебных крошках нет Нови-Сада вообще, это соседи, а не
# вложенные районы. Поэтому для oglasi заведены три поиска вместо одного.
# Мишелук и Алибеговац отдельных разделов на oglasi не имеют (404) — они
# внутри Петроварадина.
searches:
  - name: novi-sad-4zida
    source: 4zida
    url: https://www.4zida.rs/izdavanje-stanova/novi-sad
    max_pages: 2

  # nekretnine.rs блокирует IP дата-центров (у них DataDome), поэтому
  # с раннеров GitHub Actions он отдаёт 403, а с домашнего адреса работает.
  # optional: true — падение этого поиска не поднимает тревогу на CI.
  # Запускай watch.py локально, чтобы забрать и его объявления.
  - name: novi-sad-nekretnine
    source: nekretnine
    url: https://www.nekretnine.rs/izdavanje-stanova/novi-sad/
    max_pages: 2
    optional: true

  - name: novi-sad-oglasi
    source: oglasi
    url: https://www.oglasi.rs/nekretnine/izdavanje-stanova/novi-sad
    max_pages: 2

  - name: petrovaradin-oglasi
    source: oglasi
    url: https://www.oglasi.rs/nekretnine/izdavanje-stanova/petrovaradin
    max_pages: 1

  - name: sremska-kamenica-oglasi
    source: oglasi
    url: https://www.oglasi.rs/nekretnine/izdavanje-stanova/sremska-kamenica
    max_pages: 1

# Максимум сообщений за один проход — страховка от флуда.
max_notifications_per_run: 15

# Сколько фото класть в сообщение. Telegram шлёт альбомом от 2 до 10;
# при одном фото уходит обычное сообщение с кнопками.
photos_per_message: 6
